name: Playground - Production Deploy
run-name: Playground production · ${{ inputs.release_sha }}

concurrency:
  group: playground-production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Production에 배포할 Git 커밋 SHA'
        required: true
        type: string

jobs:
  build-app:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      checkout_ref: ${{ inputs.release_sha }}
      env: ${{ vars.PLAYGROUND_PRODUCTION_ENV }}

  deploy:
    needs: build-app
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.release_sha }}

      - name: Validate release SHA
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid release SHA: expected exactly 40 hexadecimal characters." >&2
            exit 1
          fi

          release_sha=$(printf '%s' "$RELEASE_SHA" | tr '[:upper:]' '[:lower:]')
          head_sha=$(git rev-parse HEAD)
          if [[ "$head_sha" != "$release_sha" ]]; then
            echo "Release SHA mismatch: HEAD is $head_sha, expected $release_sha." >&2
            exit 1
          fi

      - name: Download Built App
        uses: actions/download-artifact@v4
        with:
          name: built-app
          path: out

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.1.1 --activate
          yarn -v

      - name: Cache Yarn
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ~/.yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install Packages
        run: yarn install --immutable

      - name: Deploy
        run: cd out && yarn run wrangler pages deploy . --project-name "${{ secrets.CLOUDFLARE_PAGES_PLAYGROUND_PROJECT_NAME }}" --commit-message "${{ inputs.release_sha }}" --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
