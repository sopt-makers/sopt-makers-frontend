name: Label

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Label PR
        run: |
          changed_files=$(gh pr diff ${{ github.event.pull_request.number }} --name-only)

          add_label() {
            gh label create "$1" --color "0075ca" 2>/dev/null || true
            gh pr edit ${{ github.event.pull_request.number }} --add-label "$1"
          }

          if echo "$changed_files" | grep -q "^apps/crew/"; then
            add_label "🥐 Crew"
          fi

          if echo "$changed_files" | grep -q "^apps/playground/"; then
            add_label "⚡️ Playground"
          fi

          if echo "$changed_files" | grep -qE "^[^/]+$"; then
            add_label "🔗 Root"
          fi

          if echo "$changed_files" | grep -q "^\.github/workflows/"; then
            add_label "🔗 Workflows"
          fi

          changed_packages=$(echo "$changed_files" | grep "^packages/" | awk -F'/' '{print $2}' | sort -u)
          for pkg in $changed_packages; do
            add_label "🔗 Packages:$pkg"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
